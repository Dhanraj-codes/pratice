<!DOCTYPE html>
<html>
<head>
    <title>AI Job Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 30px 20px; text-align: center; }
        .header h1 { font-size: 32px; }
        .header p { opacity: 0.9; margin-top: 5px; }
        .container { max-width: 800px; margin: -20px auto 30px; padding: 0 15px; }
        .search-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 12px; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 15px; outline: none; }
        .search-box button { background: #4f46e5; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .add-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        .add-box h3 { margin-bottom: 12px; }
        .add-box input { width: 100%; padding: 11px; margin-bottom: 10px; border: 2px solid #e5e7eb; border-radius: 10px; outline: none; }
        .add-box button { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .job-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .job-card h3 { font-size: 18px; color: #111827; }
        .job-card .company { color: #4f46e5; font-weight: 600; font-size: 14px; margin: 4px 0; }
        .job-card .meta { color: #6b7280; font-size: 13px; }
        .tag { display: inline-block; background: #eef2ff; color: #4f46e5; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 8px; }
        .apply-btn { background: #4f46e5; color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .delete { display: block; text-align: right; color: #ef4444; text-decoration: none; font-size: 12px; margin-top: 8px; }
        .count { margin: 20px 5px 0; color: #6b7280; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💼 AI Job Portal</h1>
        <p>Find your dream job in Hyderabad | Python, AI, Web Dev</p>
    </div>

    <div class="container">
        <form class="search-box" method="GET" action="/">
            <input type="text" name="search" placeholder="🔍 Search Python, AI, HTML..." value="{{ search }}">
            <button type="submit">Search</button>
        </form>

        <div class="add-box">
            <h3>➕ Post a New Job</h3>
            <form method="POST" action="/add">
                <input type="text" name="title" placeholder="Job Title - e.g. Python Developer" required>
                <input type="text" name="location" placeholder="Location - e.g. Hyderabad" required>
                <input type="text" name="skills" placeholder="Skills - e.g. Python, Flask" required>
                <button type="submit">Post Job</button>
            </form>
        </div>

        <p class="count">{{ jobs|length }} Jobs Found</p>

        {% for job in jobs %}
        <div class="job-card">
            <div>
                <h3>{{ job.title }}</h3>
                {% if job.company %}<div class="company">{{ job.company }}</div>{% endif %}
                <div class="meta">📍 {{ job.location }}</div>
                <span class="tag">{{ job.skills }}</span>
                <a class="delete" href="/delete/{{ loop.index0 }}">❌ Delete</a>
            </div>
            <a class="apply-btn" href="#">Apply in 1-Click →</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
